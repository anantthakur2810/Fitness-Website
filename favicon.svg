<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="af-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="#0d0a1a" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#af-gradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Stylized Anytime Fitness Running Silhouette & Dumbbell -->
  <!-- Left Weight Plate -->
  <rect x="12" y="22" width="6" height="20" rx="2" fill="url(#af-gradient)" />
  <rect x="8" y="26" width="3" height="12" rx="1.5" fill="#a855f7" />
  
  <!-- Right Weight Plate -->
  <rect x="46" y="22" width="6" height="20" rx="2" fill="url(#af-gradient)" />
  <rect x="53" y="26" width="3" height="12" rx="1.5" fill="#a855f7" />
  
  <!-- Center Bar -->
  <rect x="18" y="29.5" width="28" height="5" rx="2" fill="#e2e8f0" />
  
  <!-- Running Figure / Dynamic Bolt -->
  <circle cx="32" cy="18" r="4.5" fill="#f43f5e" />
  <path d="M26 36 L32 25 L38 31 L45 28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M32 31 L30 42 L24 46" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M35 34 L38 43 L44 47" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

