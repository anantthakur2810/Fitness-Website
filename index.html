<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anytime Fitness Sohna — Member Management</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body>
  <header class="app-header no-print">
    <a href="#" class="brand" onclick="window.navigate('home'); return false;">
      <span class="brand-dot"></span>
      <span class="brand-name">Anytime Fitness</span>
      <span class="brand-branch">Sohna</span>
    </a>

    <nav class="nav-links">
      <button type="button" class="nav-btn active" data-view="home">Home</button>
      <button type="button" class="nav-btn" data-view="dashboard">Overview</button>
      <button type="button" class="nav-btn" data-view="members">Members</button>
      <button type="button" class="nav-btn" data-view="plans">Plans</button>
      <button type="button" class="nav-btn" data-view="attendance">Attendance</button>
      <button type="button" class="nav-btn" data-view="dues">Fee Dues</button>
      <button type="button" class="nav-btn" data-view="payments">Payments</button>
      <button type="button" class="nav-btn" data-view="settings">Settings</button>
    </nav>

    <div class="header-actions">
      <!-- Direct Theme Icon Switcher (Click cycles themes) -->
      <button 
        type="button" 
        class="btn-theme-toggle" 
        id="theme-btn" 
        title="Switch Theme" 
        aria-label="Toggle visual theme"
      >
        <span id="theme-icon">🌙</span>
      </button>

      <button type="button" class="btn btn-sm btn-primary" onclick="openAddMemberModal()">+ Member</button>
    </div>
  </header>

  <main class="container" id="view-root">
    <!-- Dynamic Minimalist Views -->
  </main>

  <dialog id="modal-generic" class="dialog-modal"></dialog>
  <div id="toast-shelf"></div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
